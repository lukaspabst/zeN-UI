name: CI, Pages Deploy & Package Publish (@zen-ui/system)

on:
  push:
    branches: [main, master]
    tags: ['v*', 'deploy']
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  verify-and-audit:
    name: Capri All-Subroutine Audit, Build & Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Capri 4-Subroutine Governance & Security Audit (orion, architect, guard, zen)
        run: npm run capri -- all

      - name: Build Showcase & Package Library (ESM + .d.ts + tokens.css)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Multi-Viewport & Security E2E Suite
        run: npm run test:e2e

      - name: Upload Pages Artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    name: Deploy Interactive Workbench & Storybook to GitHub Pages
    needs: verify-and-audit
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-package:
    name: Publish Package to GitHub Packages & GitHub Releases
    needs: verify-and-audit
    if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@lukaspabst'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build @zen-ui/system Library
        run: npm run build

      - name: Create Universal NPM Tarball (zen-ui-system.tgz)
        run: |
          TARBALL=$(npm pack)
          cp "$TARBALL" zen-ui-system.tgz

      - name: Publish @lukaspabst/zen-ui to GitHub Packages Registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "@lukaspabst/zen-ui";
            pkg.version = `1.0.${process.env.GITHUB_RUN_NUMBER || 1}`;
            pkg.publishConfig = { registry: "https://npm.pkg.github.com", access: "public" };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          npm publish

      - name: Publish Release Tarball Asset (zen-ui-system.tgz) for Direct npm install
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest zen-ui-system.tgz --clobber
          else
            gh release create latest zen-ui-system.tgz --title "@zen-ui/system Latest Package" --notes "Install in any project via: npm install https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/zen-ui-system.tgz or npm install @lukaspabst/zen-ui"
          fi
